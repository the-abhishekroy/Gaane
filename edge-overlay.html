<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const BANDS = 32;
  const LINE = 3;                       // one line width everywhere, notch included
  let cfg = { notch: null };
  let colors = { a: [255, 60, 130], b: [120, 90, 255] };
  const target = new Float32Array(BANDS);
  let low = 0, mid = 0, high = 0, energy = 0;
  let W = 0, H = 0, dpr = 1, path = null;
  let tmp, tctx, glowA, gaCtx, glowB, gbCtx;
  let angle = 0;

  const hex = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || '').trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };

  // One closed path: rounded like the display and curving around the notch.
  function buildPath() {
    const p = new Path2D();
    const inset = LINE / 2 + 0.5;
    const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
    const r = 18;
    p.moveTo(x0 + r, y0);
    if (cfg.notch) {
      const m = 2 + LINE / 2, rn = 9;
      const cx = W / 2;
      const nl = cx - cfg.notch.w / 2 - m, nr = cx + cfg.notch.w / 2 + m, nb = cfg.notch.h + m;
      p.lineTo(nl - rn, y0);
      p.arc(nl - rn, y0 + rn, rn, -Math.PI / 2, 0);
      p.lineTo(nl, nb - rn);
      p.arc(nl + rn, nb - rn, rn, Math.PI, Math.PI / 2, true);
      p.lineTo(nr - rn, nb);
      p.arc(nr - rn, nb - rn, rn, Math.PI / 2, 0, true);
      p.lineTo(nr, y0 + rn);
      p.arc(nr + rn, y0 + rn, rn, Math.PI, Math.PI * 1.5);
    }
    p.lineTo(x1 - r, y0);
    p.arc(x1 - r, y0 + r, r, -Math.PI / 2, 0);
    p.lineTo(x1, y1 - r);
    p.arc(x1 - r, y1 - r, r, 0, Math.PI / 2);
    p.lineTo(x0 + r, y1);
    p.arc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI);
    p.lineTo(x0, y0 + r);
    p.arc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5);
    p.closePath();
    path = p;
  }

  const layer = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    tmp = layer(W * dpr, H * dpr); tctx = tmp.getContext('2d');
    glowA = layer(W / 5, H / 5); gaCtx = glowA.getContext('2d');
    glowB = layer(W / 14, H / 14); gbCtx = glowB.getContext('2d');
    buildPath();
  }
  window.addEventListener('resize', resize);

  window.edgeOverlay.onConfig((c) => { cfg = c || cfg; resize(); });
  window.edgeOverlay.onFrame((d) => {
    if (!d) return;
    const a = hex(d.a), b = hex(d.b);
    if (a) colors.a = a;
    if (b) colors.b = b;
    if (Array.isArray(d.bands)) for (let i = 0; i < BANDS; i++) target[i] = d.bands[i] || 0;
  });

  const avg = (arr, from, to) => { let s = 0; for (let i = from; i < to; i++) s += arr[i]; return s / (to - from); };
  const follow = (cur, t) => cur + (t - cur) * (t > cur ? 0.5 : 0.08);
  const mix = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t];
  const rgb = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

  let last = 0;
  function draw(ts) {
    requestAnimationFrame(draw);
    const dt = Math.min(0.1, (ts - last) / 1000);
    if (ts - last < 22) return;
    last = ts;

    low = follow(low, avg(target, 0, 8));
    mid = follow(mid, avg(target, 8, 20));
    high = follow(high, avg(target, 20, 32));
    energy = follow(energy, low * 0.55 + mid * 0.3 + high * 0.15);

    // the colours flow around the screen faster when the music is busier
    angle += dt * (0.12 + 0.9 * high + 0.5 * mid);

    const glow = mix(colors.a, [255, 255, 255], 0.18 * energy);
    const A = mix(colors.a, [255, 255, 255], 0.10 * low);
    const B = mix(colors.b, [255, 255, 255], 0.10 * mid);

    tctx.clearRect(0, 0, tmp.width, tmp.height);
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = tctx.createConicGradient(angle, W / 2, H / 2);
    g.addColorStop(0, rgb(A));
    g.addColorStop(0.25, rgb(B));
    g.addColorStop(0.5, rgb(A));
    g.addColorStop(0.75, rgb(B));
    g.addColorStop(1, rgb(A));
    tctx.strokeStyle = g;
    tctx.lineWidth = LINE;
    tctx.lineJoin = 'round';
    tctx.stroke(path);

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.8 + 0.2 * energy;
    ctx.drawImage(tmp, 0, 0);

    // soft bloom: the same line shrunk, blurred and stretched back
    gaCtx.clearRect(0, 0, glowA.width, glowA.height);
    gaCtx.filter = 'blur(2.5px)';
    gaCtx.drawImage(tmp, 0, 0, glowA.width, glowA.height);
    gbCtx.clearRect(0, 0, glowB.width, glowB.height);
    gbCtx.filter = 'blur(1.5px)';
    gbCtx.drawImage(tmp, 0, 0, glowB.width, glowB.height);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.75 + 0.25 * energy;
    ctx.drawImage(glowA, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.5 + 0.5 * energy;
    ctx.drawImage(glowB, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
