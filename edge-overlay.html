<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const LINE = 3;                       // base line width, same everywhere (notch included)
  const SEG = 160;
  let cfg = { notch: null };
  let baseHue = 340;
  let palette = [[255, 70, 120], [140, 90, 255]];      // colours taken from the song's cover
  let paletteKey = '';
  let target = new Float32Array(28);
  let lv = new Float32Array(28);
  let low = 0, mid = 0, high = 0, energy = 0, flash = 0, prevLow = 0;
  let W = 0, H = 0, dpr = 1, path = null, segs = [];
  let ring, rctx, glowA, gaCtx, glowB, gbCtx, live, lvCtx, inten, inCtx, wave, wvCtx, wave2, wv2Ctx;
  let angle = 0;
  let colourPhase = 0;
  let centreS = 0.15;                    // position of the notch / top centre along the outline (0..1)

  const layer = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const hexToHue = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || '').trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (!d) return null;
    const hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return (hh * 60 + 360) % 360;
  };
  const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360},${s}%,${l}%)`;

  // Geometry: one closed path (crisp ring) plus the same outline sampled into pieces for the music map.
  function build() {
    const inset = LINE / 2 + 0.5;
    const x0 = inset, y0 = inset, x1 = W - inset, y1 = H - inset;
    const r = 18;
    const p = new Path2D();
    const pts = [];
    let centreFrom = -1, centreTo = -1;
    const arc = (cx, cy, rad, a0, a1, ccw) => {
      p.arc(cx, cy, rad, a0, a1, !!ccw);
      const n = 10;
      for (let i = 1; i <= n; i++) {
        const a = a0 + ((a1 - a0) * i) / n;
        pts.push([cx + rad * Math.cos(a), cy + rad * Math.sin(a)]);
      }
    };
    const line = (xa, ya, xb, yb) => {
      p.lineTo(xb, yb);
      const n = Math.max(1, Math.round(Math.hypot(xb - xa, yb - ya) / 6));
      for (let i = 1; i <= n; i++) pts.push([xa + ((xb - xa) * i) / n, ya + ((yb - ya) * i) / n]);
    };
    p.moveTo(x0 + r, y0); pts.push([x0 + r, y0]);
    if (cfg.notch) {
      // the line runs right along the notch edge, on the same footing as the line along the screen edge
      const m = LINE / 2 + 0.5, rb = 10, rt = 6;
      const nl = cfg.notch.x0 - m, nr = cfg.notch.x1 + m, nb = cfg.notch.h + m;
      line(x0 + r, y0, nl - rt, y0);
      arc(nl - rt, y0 + rt, rt, -Math.PI / 2, 0);
      line(nl, y0 + rt, nl, nb - rb);
      arc(nl + rb, nb - rb, rb, Math.PI, Math.PI / 2, true);
      centreFrom = pts.length;
      line(nl + rb, nb, nr - rb, nb);
      centreTo = pts.length - 1;
      arc(nr - rb, nb - rb, rb, Math.PI / 2, 0, true);
      line(nr, nb - rb, nr, y0 + rt);
      arc(nr + rt, y0 + rt, rt, Math.PI, Math.PI * 1.5);
      line(nr + rt, y0, x1 - r, y0);
    } else {
      centreFrom = pts.length;
      line(x0 + r, y0, x1 - r, y0);
      centreTo = pts.length - 1;
    }
    arc(x1 - r, y0 + r, r, -Math.PI / 2, 0);
    line(x1, y0 + r, x1, y1 - r);
    arc(x1 - r, y1 - r, r, 0, Math.PI / 2);
    line(x1 - r, y1, x0 + r, y1);
    arc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI);
    line(x0, y1 - r, x0, y0 + r);
    arc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5);
    p.closePath();
    path = p;

    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const L = cum[cum.length - 1];
    centreS = ((cum[centreFrom] + cum[centreTo]) / 2) / L;
    segs = [];
    let j = 0;
    for (let k = 0; k < SEG; k++) {
      const s0 = (k / SEG) * L, s1 = ((k + 1) / SEG) * L;
      while (j < pts.length - 1 && cum[j + 1] < s0) j++;
      const poly = [pts[j]];
      for (let q = j + 1; q < pts.length && cum[q] <= s1; q++) poly.push(pts[q]);
      if (poly.length < 2) poly.push(pts[Math.min(pts.length - 1, j + 1)]);
      let inNotch = false;
      if (cfg.notch) {
        const mx = poly.reduce((a, q) => a + q[0], 0) / poly.length, my = poly.reduce((a, q) => a + q[1], 0) / poly.length;
        inNotch = my < cfg.notch.h + 30 && mx > cfg.notch.x0 - 30 && mx < cfg.notch.x1 + 30;
      }
      segs.push({ poly, s: (k + 0.5) / SEG, inNotch });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ring = layer(W * dpr, H * dpr); rctx = ring.getContext('2d');
    live = layer(W * dpr, H * dpr); lvCtx = live.getContext('2d');
    glowA = layer(W / 5, H / 5); gaCtx = glowA.getContext('2d');
    glowB = layer(W / 14, H / 14); gbCtx = glowB.getContext('2d');
    inten = layer(W / 4, H / 4); inCtx = inten.getContext('2d');
    wave = layer(W / 4, H / 4); wvCtx = wave.getContext('2d');
    wave2 = layer(W / 4, H / 4); wv2Ctx = wave2.getContext('2d');
    build();
  }
  window.addEventListener('resize', resize);

  window.edgeOverlay.onConfig((c) => { cfg = c || cfg; resize(); });
  window.edgeOverlay.onFrame((d) => {
    if (!d) return;
    const h = hexToHue(d.a);
    if (h !== null) baseHue = h;
    if (Array.isArray(d.palette) && d.palette.length) {
      const key = d.palette.join(',');
      if (key !== paletteKey) {
        paletteKey = key;
        palette = d.palette.map((x) => { const n = parseInt(String(x).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; });
      }
    }
    if (Array.isArray(d.bands) && d.bands.length) {
      if (target.length !== d.bands.length) { target = new Float32Array(d.bands.length); lv = new Float32Array(d.bands.length); }
      for (let i = 0; i < d.bands.length; i++) target[i] = d.bands[i] || 0;
    }
  });

  const avg = (arr, from, to) => { let t = 0; for (let i = from; i < to; i++) t += arr[i]; return t / Math.max(1, to - from); };
  const follow = (cur, t, up, down) => cur + (t - cur) * (t > cur ? up : down);

  // The spectrum repeats four times around the screen (bass at each joint, highs between), so every stretch of the
  // border always carries a mix of the music and no area is left dark.
  function levelAt(sv) {
    const u = Math.abs(((sv * 4) % 2) - 1);      // 0 .. 1, four triangles around the outline
    const n = lv.length;
    const f = u * (n - 1), i0 = Math.floor(f), i1 = Math.min(n - 1, i0 + 1), fr = f - i0;
    return lv[i0] * (1 - fr) + lv[i1] * fr;
  }

  let last = 0;
  function draw(ts) {
    requestAnimationFrame(draw);
    const dt = Math.min(0.1, (ts - last) / 1000);
    if (ts - last < 14) return;
    last = ts;
    const n = lv.length;

    for (let i = 0; i < n; i++) lv[i] = follow(lv[i], target[i], 0.85, 0.3);
    const q = Math.floor(n / 4);
    low = follow(low, avg(lv, 0, q), 0.85, 0.25);
    mid = follow(mid, avg(lv, q, q * 2 + 2), 0.85, 0.25);
    high = follow(high, avg(lv, q * 2 + 2, n), 0.85, 0.25);
    energy = follow(energy, low * 0.5 + mid * 0.3 + high * 0.2, 0.8, 0.2);
    flash = Math.max(flash * 0.82, Math.max(0, low - prevLow) * 4);
    prevLow = low;

    angle += dt * (0.18 + 1.1 * high + 0.7 * mid + 0.9 * flash);
    // One colour flowing into the next. The ring only ever shows a blend of two neighbouring cover colours, and that
    // pair itself slides along the palette over time (faster with the music), so there are no separate colour blocks.
    colourPhase += dt * (0.08 + 0.55 * energy + 0.9 * flash);
    const lift = 0.14 * energy + 0.06 * flash;
    let cols = palette.length > 1 ? palette : [palette[0], palette[0].map((v) => Math.min(255, v + (255 - v) * 0.35))];
    const np = cols.length;
    const ip = Math.floor(colourPhase) % np, fp = colourPhase - Math.floor(colourPhase);
    const ease = fp * fp * (3 - 2 * fp);
    const mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
    const cA = mixc(cols[ip], cols[(ip + 1) % np], ease);
    const cB = mixc(cols[(ip + 1) % np], cols[(ip + 2) % np], ease);
    const STOPS = 36;
    const stops = [];
    for (let i = 0; i <= STOPS; i++) {
      const w = 0.5 + 0.5 * Math.cos((i / STOPS) * Math.PI * 2);
      const w2 = w * w * (3 - 2 * w);
      const c = mixc(cA, cB, w2);
      stops.push(`rgb(${(c[0] + (255 - c[0]) * lift) | 0},${(c[1] + (255 - c[1]) * lift) | 0},${(c[2] + (255 - c[2]) * lift) | 0})`);
    }
    const sweep = (c) => {
      const g = c.createConicGradient(angle, W / 2, H / 2);
      for (let i = 0; i <= STOPS; i++) g.addColorStop(i / STOPS, stops[i]);
      return g;
    };

    // crisp base ring, one width everywhere
    rctx.setTransform(1, 0, 0, 1, 0, 0);
    rctx.clearRect(0, 0, ring.width, ring.height);
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    rctx.strokeStyle = sweep(rctx);
    rctx.lineWidth = LINE;
    rctx.lineJoin = 'round';
    rctx.stroke(path);

    // map of how hard each stretch of the border is being hit (for the line's own brightness)
    inCtx.setTransform(1, 0, 0, 1, 0, 0);
    inCtx.clearRect(0, 0, inten.width, inten.height);
    inCtx.setTransform(inten.width / W, 0, 0, inten.height / H, 0, 0);
    inCtx.lineCap = 'butt'; inCtx.lineJoin = 'round'; inCtx.lineWidth = 22;
    // coloured light pushing inward from the border: depth follows the music
    wvCtx.setTransform(1, 0, 0, 1, 0, 0);
    wvCtx.clearRect(0, 0, wave.width, wave.height);
    wvCtx.setTransform(wave.width / W, 0, 0, wave.height / H, 0, 0);
    wvCtx.lineCap = 'butt'; wvCtx.lineJoin = 'round';
    wvCtx.strokeStyle = sweep(wvCtx);
    // depth of the light is the same all around (global pulse), nudged up or down a little by the local sound
    const globalAmt = 0.5 + 0.5 * Math.min(1, energy * 1.15 + flash * 0.3);
    for (const sg of segs) {
      const lvl = Math.min(1, levelAt(sg.s));
      const local = 0.65 + 0.35 * lvl;
      const amt = globalAmt * local * (sg.inNotch ? 0.95 : 1);
      inCtx.strokeStyle = `rgba(255,255,255,${Math.min(1, 0.25 + 0.9 * lvl).toFixed(3)})`;
      wvCtx.globalAlpha = Math.min(1, 0.3 + 0.7 * amt);
      wvCtx.lineWidth = 12 + 120 * amt;
      for (const c of [inCtx, wvCtx]) {
        c.beginPath();
        c.moveTo(sg.poly[0][0], sg.poly[0][1]);
        for (let i = 1; i < sg.poly.length; i++) c.lineTo(sg.poly[i][0], sg.poly[i][1]);
        c.stroke();
      }
    }
    wvCtx.globalAlpha = 1;
    wv2Ctx.setTransform(1, 0, 0, 1, 0, 0);
    wv2Ctx.clearRect(0, 0, wave2.width, wave2.height);
    wv2Ctx.filter = 'blur(7px)';
    wv2Ctx.drawImage(wave, 0, 0);
    wv2Ctx.filter = 'none';

    gaCtx.clearRect(0, 0, glowA.width, glowA.height);
    gaCtx.filter = 'blur(2.5px)';
    gaCtx.drawImage(ring, 0, 0, glowA.width, glowA.height);
    gbCtx.clearRect(0, 0, glowB.width, glowB.height);
    gbCtx.filter = 'blur(1.5px)';
    gbCtx.drawImage(ring, 0, 0, glowB.width, glowB.height);

    // Layers are stacked with plain alpha (never added together), so colours blend between the cover's own
    // colours and never saturate into hues that are not in the picture.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    // light pushing into the screen
    ctx.globalAlpha = Math.min(1, 0.6 + 0.4 * energy + flash * 0.25);
    ctx.drawImage(wave2, 0, 0, canvas.width, canvas.height);
    // soft bloom hugging the line
    ctx.globalAlpha = 0.55;
    ctx.drawImage(glowA, 0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = 0.4;
    ctx.drawImage(glowB, 0, 0, canvas.width, canvas.height);
    // the crisp line
    ctx.globalAlpha = 0.9;
    ctx.drawImage(ring, 0, 0);
    // the line is fully lit exactly where the music is hitting
    lvCtx.setTransform(1, 0, 0, 1, 0, 0);
    lvCtx.globalCompositeOperation = 'source-over';
    lvCtx.clearRect(0, 0, live.width, live.height);
    lvCtx.drawImage(ring, 0, 0);
    lvCtx.globalCompositeOperation = 'destination-in';
    lvCtx.drawImage(inten, 0, 0, live.width, live.height);
    ctx.globalAlpha = 1;
    ctx.drawImage(live, 0, 0);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  resize();
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
